name: Weekly SAM.gov Data Update

on:
  schedule:
    # Run every Monday at 00:00 UTC (Sunday 7pm EST / 8pm EDT)
    - cron: '0 0 * * 1'
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests
      
      - name: Run data processor
        run: python data_processor.py
        continue-on-error: true
      
      - name: Check if data file exists
        id: check_data
        run: |
          if [ -f "data/processed_contracts.csv" ]; then
            echo "data_exists=true" >> $GITHUB_OUTPUT
            echo "Data file exists with $(wc -l < data/processed_contracts.csv) lines"
          else
            echo "data_exists=false" >> $GITHUB_OUTPUT
            echo "No data file generated"
          fi
      
      - name: Commit and push changes
        if: steps.check_data.outputs.data_exists == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/processed_contracts.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Weekly data update: $(date +'%Y-%m-%d')" && git push)
      
      - name: Report status
        run: |
          echo "=== Update Summary ==="
          echo "Date: $(date)"
          if [ -f "data/processed_contracts.csv" ]; then
            echo "Records: $(tail -n +2 data/processed_contracts.csv | wc -l)"
          else
            echo "Warning: Data update may have failed. Check manually."
          fi
